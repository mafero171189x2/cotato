name = "cotato-api"
main = "worker/index.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Base de datos D1
[[d1_databases]]
binding = "DB"
database_name = "cotato-db"
database_id = "ada64087-a80c-4028-ae29-6ff700d72742"

# Variables de entorno
[vars]
CORS_ORIGIN = "https://cotato.pages.dev"
# Cuenta que envía Y recibe SOLO las alertas de error del Worker (bugs,
# fallas de la base, etc.) — se mantiene separada de la cuenta de la tienda
# a propósito, para que un error nunca se mezcle con los mails que ve un
# cliente. Requiere su propia contraseña de aplicación en GMAIL_APP_PASSWORD
# (la de ESTA cuenta puntual, no la de la tienda).
GMAIL_USER = "mafero171189@gmail.com"
# Por si en algún momento querés que el destino sea otro mail distinto del
# que envía (GMAIL_USER de arriba). Vacío/comentado = se manda a sí misma.
# GMAIL_ERROR_TO = "otro-mail@gmail.com"
# Cuenta desde la que salen TODOS los demás mails: bienvenida, recuperar
# contraseña, confirmación de pedido, cancelación, avisos de pedido
# nuevo/cancelado al admin. Requiere su propia contraseña de aplicación
# (ver GMAIL_APP_PASSWORD_TIENDA como Secret, más abajo).
GMAIL_USER_TIENDA = "cotato.tienda@gmail.com"

# Modelo de Gemini que usan el chat del cliente y las herramientas del panel
# admin (agente.js, admin-ia.js, admin-analisis.js). No es secreto, es solo
# un nombre de modelo — por eso va acá y no como Secret.
#
# Si Google discontinúa este modelo (ya pasó una vez con gemini-2.0-flash,
# dado de baja el 1/6/2026), alcanza con cambiar esta línea y hacer push —
# no hace falta tocar ningún archivo de worker/routes/.
GEMINI_MODELO = "gemini-3.5-flash-lite"

# JWT_SECRET, GMAIL_APP_PASSWORD y GMAIL_APP_PASSWORD_TIENDA se configuran
# como secretos, NO en este archivo:
#   wrangler secret put GMAIL_APP_PASSWORD_TIENDA
# GEMINI_API_KEY también va como Secret (Settings -> Variables and Secrets -> Encrypt).
