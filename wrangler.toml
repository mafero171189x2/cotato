name = "cotato-api"
main = "worker/index.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Base de datos D1
[[d1_databases]]
binding = "DB"
database_name = "cotato-db"
database_id = "ada64087-a80c-4028-ae29-6ff700d72742"

# Variables de entorno
[vars]
CORS_ORIGIN = "https://cotato.pages.dev"
GMAIL_USER = "mafero171189x2@gmail.com"

# Modelo de Gemini que usan el chat del cliente y las herramientas del panel
# admin (agente.js, admin-ia.js, admin-analisis.js). No es secreto, es solo
# un nombre de modelo — por eso va acá y no como Secret.
#
# Si Google discontinúa este modelo (ya pasó una vez con gemini-2.0-flash,
# dado de baja el 1/6/2026), alcanza con cambiar esta línea y hacer push —
# no hace falta tocar ningún archivo de worker/routes/.
GEMINI_MODELO = "gemini-3.5-flash-lite"

# JWT_SECRET y GMAIL_APP_PASSWORD se configuran como secretos, NO en este archivo.
# GEMINI_API_KEY también va como Secret (Settings -> Variables and Secrets -> Encrypt).
